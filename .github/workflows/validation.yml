name: Run multiple checks

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ./scripts/requirements_github_workflow.txt

      - name: Run Ruff linter checks
        run: ruff check ./custom_components/ tests/

      - name: Run Codespell checks
        run: codespell custom_components/ -I .codespellignore

      - name: Run Python code style with Black checks
        run: black --check ./custom_components/ tests/

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test environment
        run: python -m pip install -r requirements.txt -r requirements-test.txt homeassistant==2026.9.1
      - name: Run regression tests and local OPC UA server checks
        run: python -m pytest -q

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check panel formatting
        run: npx prettier --check custom_components/ha_opcua/www/panel.js tests/panel-ui.test.cjs
      - name: Exercise panel in Chromium
        run: npm run test:panel
